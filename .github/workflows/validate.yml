name: Validate application
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    name: Validate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Locked install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: TypeScript and production build
        run: npm run build
      - name: Dependency advisories
        run: npm audit --audit-level=low
      - name: Install isolated browser tooling
        run: npm install --prefix "$RUNNER_TEMP/pgplan-browser-tools" --ignore-scripts --no-audit --no-fund playwright@1.62.1
      - name: Install browser engines
        run: node "$RUNNER_TEMP/pgplan-browser-tools/node_modules/playwright/cli.js" install chromium firefox webkit
      - name: Browser validation (generated input only)
        run: node scripts/hosted-browser-check.mjs
